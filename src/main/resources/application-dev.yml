app:
  init-data: true

spring:
  liquibase:
    enabled: true
    drop-first: true  # Clean start

  datasource:
    url: jdbc:h2:mem:tennis_db;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8888/realms/myRealm

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: true

  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  swagger-ui:
    enabled: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    liquibase: INFO
