server:
  port: 8080

app:
  init-data: false

spring:
  application:
    name: Tennis Club

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8888/realms/myRealm
          
  profiles:
    active: dev

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  jackson:
    serialization:
      write-dates-as-timestamps: false